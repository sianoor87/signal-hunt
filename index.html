<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Signal Hunt</title>

        <style>
            * {
                  box-sizing: border-box;
                        -webkit-tap-highlight-color: transparent;
                            }

                                body {
                                      margin: 0;
                                            min-height: 100vh;
                                                  background:
                                                          radial-gradient(circle at 50% 20%, #17345c 0%, #07111f 35%, #03070d 75%);
                                                                color: #fff;
                                                                      font-family: Arial, sans-serif;
                                                                            overflow: hidden;
                                                                                }

                                                                                    .app {
                                                                                          width: 100%;
                                                                                                max-width: 480px;
                                                                                                      min-height: 100vh;
                                                                                                            margin: auto;
                                                                                                                  padding: 22px 18px;
                                                                                                                        display: flex;
                                                                                                                              flex-direction: column;
                                                                                                                                  }

                                                                                                                                      .top {
                                                                                                                                            display: flex;
                                                                                                                                                  justify-content: space-between;
                                                                                                                                                        align-items: center;
                                                                                                                                                            }

                                                                                                                                                                .logo {
                                                                                                                                                                      font-size: 20px;
                                                                                                                                                                            font-weight: 800;
                                                                                                                                                                                  letter-spacing: 1px;
                                                                                                                                                                                      }

                                                                                                                                                                                          .status {
                                                                                                                                                                                                font-size: 11px;
                                                                                                                                                                                                      color: #57f6a5;
                                                                                                                                                                                                            border: 1px solid #57f6a5;
                                                                                                                                                                                                                  padding: 6px 9px;
                                                                                                                                                                                                                        border-radius: 20px;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                .hero {
                                                                                                                                                                                                                                      text-align: center;
                                                                                                                                                                                                                                            margin-top: 38px;
                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                    .hero h1 {
                                                                                                                                                                                                                                                          margin: 0;
                                                                                                                                                                                                                                                                font-size: 38px;
                                                                                                                                                                                                                                                                      letter-spacing: -1px;
                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                              .hero p {
                                                                                                                                                                                                                                                                                    color: #8da1b8;
                                                                                                                                                                                                                                                                                          margin-top: 8px;
                                                                                                                                                                                                                                                                                                font-size: 14px;
                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                        .scanner {
                                                                                                                                                                                                                                                                                                              width: 250px;
                                                                                                                                                                                                                                                                                                                    height: 250px;
                                                                                                                                                                                                                                                                                                                          margin: 35px auto 25px;
                                                                                                                                                                                                                                                                                                                                border-radius: 50%;
                                                                                                                                                                                                                                                                                                                                      border: 1px solid rgba(91, 190, 255, .5);
                                                                                                                                                                                                                                                                                                                                            position: relative;
                                                                                                                                                                                                                                                                                                                                                  display: flex;
                                                                                                                                                                                                                                                                                                                                                        align-items: center;
                                                                                                                                                                                                                                                                                                                                                              justify-content: center;
                                                                                                                                                                                                                                                                                                                                                                    background:
                                                                                                                                                                                                                                                                                                                                                                            radial-gradient(circle, rgba(50,160,255,.16), transparent 60%);
                                                                                                                                                                                                                                                                                                                                                                                  box-shadow:
                                                                                                                                                                                                                                                                                                                                                                                          0 0 40px rgba(0,150,255,.15),
                                                                                                                                                                                                                                                                                                                                                                                                  inset 0 0 40px rgba(0,150,255,.08);
                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                          .scanner::before,
                                                                                                                                                                                                                                                                                                                                                                                                              .scanner::after {
                                                                                                                                                                                                                                                                                                                                                                                                                    content: "";
                                                                                                                                                                                                                                                                                                                                                                                                                          position: absolute;
                                                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 50%;
                                                                                                                                                                                                                                                                                                                                                                                                                                      border: 1px solid rgba(91, 190, 255, .25);
                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                              .scanner::before {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    width: 170px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          height: 170px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .scanner::after {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        width: 90px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              height: 90px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .sweep {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            position: absolute;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  width: 50%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        height: 2px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              background: linear-gradient(90deg, transparent, #45e6ff);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    top: 50%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          left: 50%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                transform-origin: left center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      animation: scan 3s linear infinite;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            box-shadow: 0 0 10px #45e6ff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    @keyframes scan {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          from { transform: rotate(0deg); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                to { transform: rotate(360deg); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .core {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              z-index: 2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .core-icon {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 38px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .core-text {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-size: 11px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #7fdbff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-top: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  letter-spacing: 2px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .stats {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                display: grid;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      grid-template-columns: repeat(3, 1fr);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            gap: 9px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  margin-bottom: 22px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .stat {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: rgba(255,255,255,.05);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      border: 1px solid rgba(255,255,255,.08);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  padding: 12px 6px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .stat small {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #71839a;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-bottom: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .stat strong {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      font-size: 17px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .scan-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          border: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      padding: 17px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-weight: 800;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #04101c;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              background: linear-gradient(90deg, #4de1ff, #5cf7a8);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    box-shadow: 0 10px 35px rgba(55,220,255,.18);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .scan-btn:active {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        transform: scale(.98);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .message {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            min-height: 25px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  margin-top: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #6fe8ff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 13px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .footer {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-top: auto;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #435469;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    padding-top: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .signal {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  position: fixed;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        width: 18px;
